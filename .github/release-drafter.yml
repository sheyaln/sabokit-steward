# Release Drafter config.
# Reference: https://github.com/release-drafter/release-drafter
#
# How this works:
#  - Every time a PR merges to master, the Release Drafter workflow updates
#    a DRAFT GitHub release in-place. The draft accumulates one bullet per
#    merged PR, grouped by label.
#  - Maintainers don't write release notes by hand -- they just label PRs
#    correctly. When it's time to ship, edit the draft (if needed) and click
#    "Publish".
#  - The next-version number is resolved from the labels on PRs included in
#    the release (see `version-resolver` below). Override by setting an
#    explicit version on the draft before publishing.

name-template: 'v$RESOLVED_VERSION'
tag-template:  'v$RESOLVED_VERSION'

categories:
  - title: '⚠ Breaking changes'
    labels:
      - 'breaking'
      - 'breaking-change'
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug fixes'
    labels:
      - 'bug'
      - 'bugfix'
      - 'fix'
  - title: '🔐 Security'
    labels:
      - 'security'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'dependencies'
      - 'maintenance'
  - title: '📝 Documentation'
    labels:
      - 'docs'
      - 'documentation'

# Anything unlabeled lands here so it's visible (rather than silently dropped)
# and the maintainer can either label retroactively or accept the bucket.
exclude-labels:
  - 'skip-changelog'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'breaking'
      - 'breaking-change'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'bugfix'
      - 'fix'
      - 'security'
      - 'chore'
      - 'refactor'
      - 'dependencies'
      - 'maintenance'
      - 'docs'
      - 'documentation'
  default: patch

# Auto-apply labels based on branch / title patterns so a PR doesn't need
# manual triage to land in the right bucket. Maintainer can still override.
autolabeler:
  - label: 'feature'
    branch:
      - '/^feat(ure)?[/-].+/'
    title:
      - '/^feat(\(.+\))?: /i'
  - label: 'bug'
    branch:
      - '/^fix[/-].+/'
    title:
      - '/^fix(\(.+\))?: /i'
  - label: 'docs'
    branch:
      - '/^docs?[/-].+/'
    title:
      - '/^docs?(\(.+\))?: /i'
  - label: 'chore'
    branch:
      - '/^chore[/-].+/'
    title:
      - '/^chore(\(.+\))?: /i'
  - label: 'refactor'
    title:
      - '/^refactor(\(.+\))?: /i'
  - label: 'dependencies'
    title:
      - '/^(deps|bump)(\(.+\))?: /i'
      - '/^update .+ to /i'
  - label: 'security'
    title:
      - '/^sec(urity)?(\(.+\))?: /i'
  - label: 'breaking'
    title:
      - '/!: /'

template: |
  ## What's changed in $RESOLVED_VERSION

  $CHANGES

  **Full Changelog**: https://github.com/sheyaln/sabokit-steward/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
