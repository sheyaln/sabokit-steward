# Production-style docker-compose for Steward.
#
# Pulls the published image from GHCR. Set DJANGO_SECRET_KEY, POSTGRES_PASSWORD,
# and the OIDC_* values in a .env file alongside this one. See the README for
# the minimum env var list.
#
# This file is a starting point, not a finished deployment. You almost
# certainly want to put a real TLS-terminating reverse proxy (Traefik,
# nginx, Caddy) in front of `web` and not expose port 8000 publicly.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-steward}
      POSTGRES_USER: ${POSTGRES_USER:-steward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - steward-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steward}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/sheyaln/sabokit-steward:${STEWARD_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-steward}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-steward}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - steward-media:/srv/media
    depends_on:
      db:
        condition: service_healthy

  qcluster:
    image: ghcr.io/sheyaln/sabokit-steward:${STEWARD_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "manage.py", "qcluster"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-steward}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-steward}
      STEWARD_RUN_MIGRATIONS: "0"
      STEWARD_COLLECTSTATIC: "0"
    volumes:
      - steward-media:/srv/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  steward-pgdata:
  steward-media:
