# Authentik blueprint: provisions everything Steward needs to authenticate
# AND to drive the Authentik admin API in a dev environment.
#
# This file IS the source of truth for the dev IdP state. It is re-applied on
# every Authentik startup, so wiping the Authentik volumes and bringing the
# stack back up restores the provider, application, groups, test users, the
# service-account token, and the custom scope mapping without any clickops.
#
# To add a new persistent dev user or group, edit this file -- do NOT create
# the object via the Authentik admin UI (UI-created objects live only in the
# volume and disappear on a volume reset).
#
# Dev only. Do not reuse these credentials anywhere real.

version: 1
metadata:
  name: Steward (dev)
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # --- Groups ----------------------------------------------------------------
  - model: authentik_core.group
    id: group-steward-admins
    identifiers:
      name: steward-admins
    attrs:
      is_superuser: false

  - model: authentik_core.group
    id: group-steward-members
    identifiers:
      name: steward-members
    attrs:
      is_superuser: false

  # --- Scope mapping: emit groups claim in the id_token / userinfo ----------
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-groups-steward
    attrs:
      name: "OAuth Mapping: Steward groups"
      scope_name: groups
      description: "Adds the user's group names to the OIDC token."
      expression: |
        return {
            "groups": [group.name for group in user.ak_groups.all()],
        }

  # --- Service account + API token Steward uses to call Authentik API -------
  - model: authentik_core.user
    id: user-steward-svc
    identifiers:
      username: steward-svc
    attrs:
      name: Steward service account
      email: steward-svc@steward.test
      type: service_account
      is_active: true
      path: service-accounts
      groups:
        - !Find [authentik_core.group, [name, authentik Admins]]

  - model: authentik_core.token
    identifiers:
      identifier: steward-api-token
    attrs:
      intent: api
      user: !KeyOf user-steward-svc
      key: steward-dev-api-token-not-for-production
      expiring: false
      description: "Dev API token for the Steward web app."

  # --- Human test users ------------------------------------------------------
  # Passwords default to the username + "-dev"; override per user via env if
  # you want something less guessable.
  - model: authentik_core.user
    identifiers:
      username: alice
    attrs:
      name: Alice Admin
      email: alice@steward.test
      password: !Env [AUTHENTIK_DEV_PASSWORD_ALICE, alice-dev]
      is_active: true
      path: users
      groups:
        - !KeyOf group-steward-admins
        - !KeyOf group-steward-members

  - model: authentik_core.user
    identifiers:
      username: bob
    attrs:
      name: Bob Member
      email: bob@steward.test
      password: !Env [AUTHENTIK_DEV_PASSWORD_BOB, bob-dev]
      is_active: true
      path: users
      groups:
        - !KeyOf group-steward-members

  - model: authentik_core.user
    identifiers:
      username: shey
    attrs:
      name: Shey
      email: shey@steward.test
      password: !Env [AUTHENTIK_DEV_PASSWORD_SHEY, shey-dev]
      is_active: true
      path: users
      groups:
        - !KeyOf group-steward-admins
        - !KeyOf group-steward-members
        - !Find [authentik_core.group, [name, authentik Admins]]

  # --- OIDC provider + application ------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: steward
    attrs:
      client_type: confidential
      client_id: steward
      client_secret: steward-dev-secret-not-for-production
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:8000/oidc/callback/
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=10
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf scope-groups

  - model: authentik_core.application
    identifiers:
      slug: steward
    attrs:
      name: Steward
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, steward]]
      meta_launch_url: http://localhost:8000/
      open_in_new_tab: false
